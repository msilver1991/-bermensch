name: Build
on: [push, workflow_dispatch]
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Linux dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libxext-dev libfreetype6-dev libfontconfig1-dev libgl1-mesa-dev
      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release -DUBERMENSCH_BUILD_TESTS=ON
      - name: Build
        run: cmake --build build --config Release --parallel
      - name: Upload plugin
        uses: actions/upload-artifact@v4
        with:
          name: Ubermensch-${{ runner.os }}
          path: |
            build/Ubermensch_artefacts/Release/VST3
            build/Ubermensch_artefacts/Release/AU
            build/Ubermensch_artefacts/Release/Standalone
